[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (fast, no I/O beyond temp files)
    integration: Integration tests (may use filesystem, database)
    slow: Slow tests (skipped by default, run with --run-slow)
    requires_gui: Tests requiring PyQt6 GUI
    requires_network: Tests requiring network access

# Default options
addopts = -v --tb=short -ra

# Ignore legacy test directories
norecursedirs = scripts/tests .git __pycache__ .venv

# Strict marker enforcement
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
