[pytest]
# Pytest configuration for Jelly Rancher integration tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = 
    scripts/tests
    scripts/core/tests

# Coverage settings
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=scripts/core
    --cov=scripts/_common
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=70

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multiple components
    slow: Slow-running tests (deselect with '-m "not slow"')
    ui: Tests that require PyQt5/GUI components
    backend: Backend logic tests (no UI)
    tmdb: Tests for TMDB cache functionality
    episodes: Tests for episode title management
    movies: Tests for movie name management
    fixer: Tests for file fixing operations
    analyzer: Tests for analysis operations
    requires_network: Tests that require network access

# Ignore patterns
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .venv
    venv
    node_modules
    .pytest_cache

# Logging
log_cli = false
log_cli_level = INFO
log_file = logs/pytest.log
log_file_level = DEBUG

# Timeout settings (optional, requires pytest-timeout)
# timeout = 300
# timeout_method = thread

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum Python version
minversion = 3.8
